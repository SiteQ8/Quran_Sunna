plugins { id 'com.android.application' }

android {
    namespace 'io.github.siteq8.sunnati'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.siteq8.sunnati"
        minSdk 23
        targetSdk 34
        versionCode 63
        versionName "6.3.0"

        /* The address the wrapper opens. Everything the app does lives there, so
           a fix published to the site reaches anyone who installed this without
           a new upload to the store. */
        manifestPlaceholders = [
            hostName            : "siteq8.github.io",
            defaultUrl          : "https://siteq8.github.io/Quran_Sunna/",
            launcherName        : "سُنّتي",
            assetStatements     : '[{ "relation": ["delegate_permission/common.handle_all_urls"], ' +
                                  '"target": { "namespace": "web", "site": "https://siteq8.github.io" }}]',
            statusBarColor      : "@color/colorPrimary",
            navigationBarColor  : "@color/navigationColor",
            splashScreenColor   : "@color/backgroundColor",
            splashImageDrawable : "@drawable/splash",
            orientation         : "portrait"
        ]
    }

    signingConfigs {
        release {
            /* Filled from a keystore.properties you keep off the repository.
               See the readme beside this file. */
            def props = new Properties()
            def file = rootProject.file('keystore.properties')
            if (file.exists()) {
                props.load(new FileInputStream(file))
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
