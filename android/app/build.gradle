plugins { id 'com.android.application' }

android {
    namespace 'com.eworldq8.sunnati'
    compileSdk 36

    defaultConfig {
        applicationId "com.eworldq8.sunnati"
        minSdk 26
        targetSdk 36
        versionCode 324
        versionName "8.87.38"

        /* The address the wrapper opens. Everything the app does lives there, so
           a fix published to the site reaches anyone who installed this without
           a new upload to the store. */
        manifestPlaceholders = [
            hostName            : "sunnati.3li.info",
            defaultUrl          : "https://sunnati.3li.info/",
            launcherName        : "سُنّتي",
            assetStatements     : '[{ "relation": ["delegate_permission/common.handle_all_urls"], ' +
                                  '"target": { "namespace": "web", "site": "https://sunnati.3li.info" }}]',
            statusBarColor      : "@color/colorPrimary",
            navigationBarColor  : "@color/navigationColor",
            splashScreenColor   : "@color/backgroundColor",
            splashImageDrawable : "@drawable/splash",
            orientation         : "portrait"
        ]
    }

    signingConfigs {
        release {
            /* Filled from a keystore.properties you keep off the repository.
               See the readme beside this file. */
            def props = new Properties()
            def file = rootProject.file('keystore.properties')
            if (file.exists()) {
                props.load(new FileInputStream(file))
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    lint {
        // Lint had never been run against this project: seventeen errors and
        // twenty one warnings were waiting in it, one of them a crash on every
        // phone below android 11. Now that it stands at zero, a warning counts
        // as a fault too, or the pile simply starts again. Anything deliberate
        // goes in app/lint.xml with the reason written beside it.
        warningsAsErrors true
        abortOnError true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    /* nothing: the page runs in the platform's own web view */
}
