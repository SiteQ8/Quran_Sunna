# The Xcode project is generated from this, not committed as a .pbxproj: that
# file is thousands of lines of machine ids that no one can review and that
# conflict on every merge. XcodeGen builds it from these twenty lines.
name: Sunnati
options:
  bundleIdPrefix: com.eworldq8
  deploymentTarget:
    iOS: "15.0"
  # The build runs on Xcode 16.4, which reads what xcodegen writes. The earlier
  # pin to 15.4 did not take: xcodegen kept writing format 77 and the build
  # could not open its own project. Updating the toolchain was the fix, not
  # holding the generator back.
  xcodeVersion: "16.4"
settings:
  MARKETING_VERSION: "8.87.17"
  CURRENT_PROJECT_VERSION: "303"
  DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
  SWIFT_VERSION: "5.0"
targets:
  Sunnati:
    type: application
    platform: iOS
    sources:
      - path: Sunnati
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.eworldq8.sunnati
      INFOPLIST_FILE: Sunnati/Info.plist
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Manual
      # Two targets, two profiles: the app and the widget each carry their own
      # bundle id and Apple issues a profile per id. The names come in from the
      # workflow, read off the profiles themselves, so nothing here goes stale.
      PROVISIONING_PROFILE_SPECIFIER: $(PROFILE_APP)
      CODE_SIGN_IDENTITY: $(SIGN_IDENTITY)
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: Widget
        embed: true
    entitlements:
      path: Sunnati/Sunnati.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.eworldq8.sunnati

  # The widget is what a website cannot be: the next prayer on the home screen.
  # It reads the times the app wrote to the shared group rather than computing
  # its own, so the two never disagree.
  Widget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.eworldq8.sunnati.widget
      INFOPLIST_FILE: Widget/Info.plist
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Manual
      PROVISIONING_PROFILE_SPECIFIER: $(PROFILE_WIDGET)
      CODE_SIGN_IDENTITY: $(SIGN_IDENTITY)
      SKIP_INSTALL: YES
      # a widget is built as a swiftui extension, and xcode needs telling
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.eworldq8.sunnati
