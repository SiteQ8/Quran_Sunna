<script>
  /* One address to hand anyone, sunnati.3li.info/app: an iPhone or an iPad
     is sent to the App Store and an android phone to Google Play, before the
     page is drawn, and replaced rather than followed, so the back button
     does not land here and bounce to the store again. An iPad asks for the
     desktop pages and says Macintosh, but a Mac has no touch. Inside the app
     itself the reader has it already, and android hands the app every
     address of the site, this one too: it opens the app's front instead. A
     computer stays here and is shown the two stores and the app in the
     browser. */
  (function () {
    var ua = navigator.userAgent || '';
    var to = '';
    if (typeof window.SunnatiApp !== 'undefined' || / SunnatiApp\//.test(ua)) to = './';
    else if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
      to = 'https://apps.apple.com/app/id6814355836';
    } else if (/Android/i.test(ua)) {
      to = 'https://play.google.com/store/apps/details?id=com.eworldq8.sunnati';
    }
    if (to) location.replace(to);
  }());
</script>
