# The app's page on Google Play: the promotional film, the icon, the feature
# graphic, the phone screenshots, and the words of the page. Play takes the
# film only as a YouTube link, so it is uploaded to the channel first and its
# link given here; the pictures come from the repository, play/listing and
# play/feature-graphic, and each kind is replaced whole in every language of
# the page. The words come from play/listing, a folder for each language by
# the code Play gives it, ar for the Arabic page as before, and each is
# written in its own page; a language with no page yet is given one. The
# phone screenshots of a language come from its own folder beside the Arabic
# ones, play/listing/en-US/phone, and the Arabic page takes play/listing/phone.
#
# Run by hand only, from the Actions tab: «Play listing», Run workflow. With
# nothing asked it reads the tracks and the page and changes nothing.
name: Play listing

on:
  workflow_dispatch:
    inputs:
      video:
        description: 'the film on YouTube, in any form YouTube writes it (empty leaves the film as it is)'
        required: false
        default: ''
      graphics:
        description: 'replace the icon, the feature graphic and the phone screenshots from play/listing, each language its own'
        type: boolean
        default: false
      text:
        description: 'write the words of every language from play/listing, each in its own page, making the pages not there yet'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: المكتبة
        run: python3 -m pip install --quiet --break-system-packages cryptography
      - name: صفحة التطبيق
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          VIDEO: ${{ inputs.video }}
          GRAPHICS: ${{ inputs.graphics }}
          TEXT: ${{ inputs.text }}
        run: |
          set -- --status
          [ -n "$VIDEO" ] && set -- "$@" --video "$VIDEO"
          [ "$GRAPHICS" = true ] && set -- "$@" --icon play/listing/icon-512.png \
            --feature play/feature-graphic-1024x500.png --phone play/listing/phone
          [ "$TEXT" = true ] && set -- "$@" --text play/listing
          python3 tools/android/play-listing.py "$@"
