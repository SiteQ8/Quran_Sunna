# The app's page on the App Store, without building anything: what each
# version is and where its review stands, and the 6.9 inch screenshots of
# ios/screenshots/6.9-inch and the 13 inch iPad's of ios/screenshots/ipad-13
# put in place of those there. Every language is its own page: the pictures
# of a language come from its folder beside those, ios/screenshots/en-US, and
# its words from ios/store/en-US and ios/whatsnew/en-US.txt, and a version sent
# makes the page of a language the store does not have yet.
#
# Run by hand only, from the Actions tab: «App Store listing», Run workflow.
#   status       reads, and changes nothing
#   screenshots  places them in the version being prepared, or a new one
#   withdraw     a version waiting for review is taken back, given them, and
#                sent again, so it waits its turn once more; one Apple has
#                begun to look at is left as it is
#   send         the version a build run prepared after TestFlight is sent
#                for review as it is, with the build of ios/project.yml and
#                what is new, and nothing is built again
#   replace      as send, but a version waiting for review is taken back
#                first and renamed to this one, with this build in it
name: App Store listing

on:
  workflow_dispatch:
    inputs:
      what:
        description: 'status, screenshots, withdraw (take back a version waiting for review, place them, send it again), send (the prepared version sent for review), or replace (a version waiting for review taken back and this build sent instead)'
        type: choice
        options: [status, screenshots, withdraw, send, replace]
        default: status

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: المكتبة
        run: python3 -m pip install --quiet --break-system-packages pyjwt cryptography
      - name: صفحة التطبيق
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          WHAT: ${{ inputs.what }}
        run: |
          python3 tools/ios/asc-release.py --status
          V=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' ios/project.yml)
          case "$WHAT" in
            screenshots) python3 tools/ios/asc-release.py --shots-only --shots ios/screenshots/6.9-inch --ipad ios/screenshots/ipad-13 --version "$V" ;;
            withdraw) python3 tools/ios/asc-release.py --shots-only --shots ios/screenshots/6.9-inch --ipad ios/screenshots/ipad-13 --version "$V" --withdraw ;;
            send|replace) B=$(sed -n 's/^ *CURRENT_PROJECT_VERSION: *"\(.*\)"/\1/p' ios/project.yml)
                  python3 tools/ios/asc-release.py --version "$V" --build "$B" --wait 10 \
                    --notes ios/whatsnew/ar-SA.txt --previews ios/previews --ipad ios/screenshots/ipad-13 --text ios/store \
                    --shots ios/screenshots/6.9-inch \
                    $([ "$WHAT" = replace ] && echo --replace) ;;
          esac
          [ "$WHAT" = status ] || python3 tools/ios/asc-release.py --status
