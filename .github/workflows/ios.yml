# Builds سُنّتي for iOS on GitHub's own mac, so no mac is needed here.
#
# Two ways to run it:
#   • push a tag like ios-v8.85.0, or press "Run workflow" in the Actions tab
#   • with no signing secrets set, it still builds and runs the tests: that is
#     worth having on its own, since it catches a broken build before anyone
#     goes near a certificate
#
# The secrets it wants, when you are ready to sign:
#   IOS_CERT_P12          the distribution certificate, base64 of the .p12
#   IOS_CERT_PASSWORD     the password you gave that .p12
#   IOS_PROFILE           the app's provisioning profile, base64 of the .mobileprovision
#   IOS_PROFILE_WIDGET    the widget's, the same way: two bundle ids, two profiles
#   IOS_TEAM_ID           the ten characters Apple calls your Team ID
#
# And three more to send the build to App Store Connect from here, so no mac
# is needed for that step either:
#   ASC_KEY_ID            the App Store Connect API key id, ten characters
#   ASC_ISSUER_ID         the issuer id beside it, a uuid
#   ASC_KEY_P8            the .p8 the key came as, base64
#
# Making them is written out in ios/README.md.

name: iOS
run-name: iOS ${{ inputs.xcode || github.ref_name }} ${{ inputs.store != 'none' && inputs.store || '' }}

on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:
    inputs:
      # Auto is the newest Xcode GitHub carries as a release, from 27.1 on,
      # the first that builds for iPhone Duo, and 26 until there is one; so
      # the day 27.1 arrives every build moves to it with nothing changed
      # here. A run by hand can still name one.
      xcode:
        description: 'Xcode to build with: auto, or a version such as 26 or 27.1 (a beta Xcode builds and photographs but is not sent to App Store Connect)'
        required: false
        default: 'auto'
      # After TestFlight. Prepare makes the App Store version ready, with the
      # build, what is new and the iPhone Duo screenshots, and leaves it for a
      # person to look at; send also sends it for review. Only ever asked for
      # by hand.
      store:
        description: 'after TestFlight: none, prepare (the App Store version made ready, not sent) or send (and sent for review)'
        type: choice
        options: [none, prepare, send]
        default: none
      watch:
        description: 'set by the Xcode 27.1 watch, not by hand'
        type: boolean
        default: false

jobs:
  # Which Xcode, and so which of GitHub's macs. macos-26 carries Xcode 26,
  # which App Store Connect takes today: it refused the first signed build,
  # made on macos-15 with Xcode 16.4, with a 409. Xcode 27 is not on macos-26
  # and never will be: GitHub keys its mac images to a major Xcode now, and 27
  # lives on the image named xcode-27. tools/ios/pick-xcode.py reads what that
  # image carries from the page GitHub publishes with it.
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      xcode: ${{ steps.pick.outputs.xcode }}
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: أيّ Xcode
        id: pick
        env:
          WANT: ${{ github.event.inputs.xcode || 'auto' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(python3 tools/ios/pick-xcode.py "$WANT")
          X=$(echo "$out" | sed -n 1p); R=$(echo "$out" | sed -n 2p)
          echo "xcode=$X" >> "$GITHUB_OUTPUT"
          echo "runner=$R" >> "$GITHUB_OUTPUT"
          echo "::notice::Xcode $X on $R"

  build:
    needs: pick
    runs-on: ${{ needs.pick.outputs.runner }}
    # the iPhone Duo step fetches an iOS runtime of several gigabytes first
    timeout-minutes: ${{ needs.pick.outputs.runner == 'xcode-27' && 75 || 30 }}
    permissions:
      contents: write   # the watch's mark is taken back when only a beta was there
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
      version: ${{ steps.numbers.outputs.version }}
      number: ${{ steps.numbers.outputs.number }}

    steps:
      - uses: actions/checkout@v7

      # the version and the build number this run makes, as project.yml has
      # them, for the store job to find the build by
      - name: الرقمان
        id: numbers
        run: |
          echo "version=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' ios/project.yml)" >> "$GITHUB_OUTPUT"
          echo "number=$(sed -n 's/^ *CURRENT_PROJECT_VERSION: *"\(.*\)"/\1/p' ios/project.yml)" >> "$GITHUB_OUTPUT"

      # the same six gates the site goes through, so a broken page never
      # reaches a phone wrapped in a shell
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: ثبّت ما تحتاجه الاختبارات
        run: npm install --no-audit --no-fund

      - name: الاختبارات
        run: node --test test/interface.test.js

      # The Xcode asked for, chosen by looking rather than by a path written
      # here: the image rotates its point releases, and a fixed path breaks
      # the day the one it names is gone.
      #
      # Each Xcode is asked its own version, because a name cannot be trusted:
      # on xcode-27, Xcode_27.1.app is a link to Xcode_27.1_beta.app. A release
      # is preferred to a release candidate, and either to a beta, and within
      # that the newest. Everything found is printed, so the log says which
      # Xcode built this and what else was there.
      - name: Xcode
        id: xcode
        env:
          WANT: ${{ needs.pick.outputs.xcode }}
        run: |
          : > "$RUNNER_TEMP/xcodes"
          seen=" "
          for x in /Applications/Xcode*.app; do
            real=$(realpath "$x") || continue
            case "$seen" in *" $real "*) continue ;; esac
            seen="$seen$real "
            v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$real/Contents/Info.plist" 2>/dev/null) || continue
            b=$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$real/Contents/version.plist" 2>/dev/null || echo '?')
            case "$real" in
              *[Bb]eta*) rank=0 ;;
              *[Rr]elease_[Cc]andidate*|*_RC*) rank=1 ;;
              *) rank=2 ;;
            esac
            echo "  $v ($b) $real"
            # padded, so a plain sort orders 27.10 after 27.9
            key=$(echo "$v" | awk -F. '{ printf "%03d.%03d.%03d", $1, $2, $3 }')
            case "$v" in "$WANT"|"$WANT".*) echo "$rank $key $real" >> "$RUNNER_TEMP/xcodes" ;; esac
          done
          XCODE=$(sort "$RUNNER_TEMP/xcodes" | tail -1 | cut -d' ' -f3-)
          [ -n "$XCODE" ] || { echo "::error::no Xcode ${WANT} on this image"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

          # App Store Connect refuses a build made with a beta Xcode, so one
          # is built, signed and photographed, and kept here rather than sent
          case "$XCODE" in *[Bb]eta*)
            echo "beta=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::$(basename "$XCODE") is a beta, so this build is kept as an artifact and not sent to App Store Connect" ;;
          esac

          # 27.1 is the first Xcode that knows iPhone Duo
          V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$XCODE/Contents/Info.plist")
          if echo "$V" | awk -F. '{ exit !($1 > 27 || ($1 == 27 && $2 >= 1)) }'; then
            echo "duo=yes" >> "$GITHUB_OUTPUT"
          fi

          # the upload goes through altool; a new Xcode is checked for it
          # before the day a release depends on it
          xcrun --find altool >/dev/null 2>&1 \
            || echo "::warning::this Xcode has no altool, so the upload step needs another way"

      - name: XcodeGen
        run: brew install xcodegen

      - name: اصنع المشروع
        run: cd ios && xcodegen generate

      # Without secrets the build stops here, having proved it compiles. With
      # them it goes on to sign and package.
      - name: هل هناك توقيع
        id: signing
        run: |
          # all five, or none: a certificate without its profiles fails
          # halfway through with a message about base64, not about profiles
          if [ -n "${{ secrets.IOS_CERT_P12 }}" ] && [ -n "${{ secrets.IOS_PROFILE }}" ] \
             && [ -n "${{ secrets.IOS_PROFILE_WIDGET }}" ] && [ -n "${{ secrets.IOS_TEAM_ID }}" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::أسرار التوقيع ناقصة، سيُبنى بلا توقيع للتحقق فقط"
          fi

      - name: ابنِ بلا توقيع
        if: steps.signing.outputs.ready == 'no'
        run: |
          cd ios
          # the real device, not the simulator: a widget extension is not built
          # for the simulator destination, so a simulator build would pass while
          # the widget stayed broken
          xcodebuild -project Sunnati.xcodeproj -scheme Sunnati \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      # The certificate goes into a keychain made for this run and thrown away
      # with the machine. A keychain of its own, not the login one, so nothing
      # here can reach anything else.
      - name: ضع الشهادة
        if: steps.signing.outputs.ready == 'yes'
        env:
          CERT: ${{ secrets.IOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE }}
          PROFILE_WIDGET: ${{ secrets.IOS_PROFILE_WIDGET }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          PASS=$(openssl rand -base64 24)
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"

          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          # Both profiles, and each is asked for its own name, which is what
          # the build settings and the export refer to it by. Reading the name
          # off the file means the workflow never has to be told it.
          DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$DIR"
          name_of () {
            security cms -D -i "$1" | plutil -extract Name raw -o - -
          }
          echo "$PROFILE" | base64 --decode > "$DIR/sunnati.mobileprovision"
          echo "$PROFILE_WIDGET" | base64 --decode > "$DIR/sunnati-widget.mobileprovision"
          echo "PROFILE_APP=$(name_of "$DIR/sunnati.mobileprovision")" >> "$GITHUB_ENV"
          echo "PROFILE_WIDGET=$(name_of "$DIR/sunnati-widget.mobileprovision")" >> "$GITHUB_ENV"

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: ابنِ ووقّع
        if: steps.signing.outputs.ready == 'yes'
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cd ios
          xcodebuild -project Sunnati.xcodeproj -scheme Sunnati \
            -configuration Release -archivePath "$RUNNER_TEMP/Sunnati.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            SIGN_IDENTITY="Apple Distribution" \
            PROFILE_APP="$PROFILE_APP" \
            PROFILE_WIDGET="$PROFILE_WIDGET" \
            archive

          sed -e "s/\$(DEVELOPMENT_TEAM)/$DEVELOPMENT_TEAM/" \
              -e "s/\$(PROFILE_APP)/$PROFILE_APP/" \
              -e "s/\$(PROFILE_WIDGET)/$PROFILE_WIDGET/" \
              exportOptions.plist > "$RUNNER_TEMP/export.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Sunnati.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/out"

      # From here straight to App Store Connect, when the api key is there.
      # The key lives only in this run's home directory and dies with it. The
      # build shows up under TestFlight within a few minutes and is then
      # attached to a version in App Store Connect by hand.
      - name: هل هناك مفتاح App Store Connect
        id: asc
        if: steps.signing.outputs.ready == 'yes'
        run: |
          if [ -n "${{ secrets.ASC_KEY_P8 }}" ] && [ -n "${{ secrets.ASC_KEY_ID }}" ] \
             && [ -n "${{ secrets.ASC_ISSUER_ID }}" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::مفتاح App Store Connect ناقص، الحزمة تُحفظ ولا تُرفع"
          fi

      - name: ارفع إلى App Store Connect
        id: upload
        if: steps.asc.outputs.ready == 'yes' && steps.xcode.outputs.beta != 'yes'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          IPA=$(ls "$RUNNER_TEMP"/out/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "uploaded=yes" >> "$GITHUB_OUTPUT"

      # A signed build cannot be installed anywhere without a developer
      # account, so until there is one the app is run in the simulator and
      # photographed. That shows it opens, that the arabic lays out right on
      # iOS, and it produces the screenshots App Store Connect asks for. What
      # it cannot show is the part that matters most: notifications arriving
      # with the app closed. Those need a real phone.
      # App Store Connect wants screenshots at two sizes, and they must show
      # the app doing its work, not a permission dialog. So location is granted
      # before launch rather than answered after, and each screen is reached by
      # its own url on the site the app loads.
      - name: صوّر لقطات المتجر
        run: |
          cd ios
          shoot () {
            DEVICE="$1"; TAG="$2"
            xcodebuild -project Sunnati.xcodeproj -scheme Sunnati \
              -destination "platform=iOS Simulator,name=$DEVICE" \
              -derivedDataPath "$RUNNER_TEMP/dd" -configuration Debug \
              CODE_SIGNING_ALLOWED=NO build

            xcrun simctl boot "$DEVICE" || true
            xcrun simctl bootstatus "$DEVICE" -b

            # granted up front, so no dialog stands in front of the app
            xcrun simctl privacy "$DEVICE" grant location com.eworldq8.sunnati || true

            APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Sunnati.app"
            xcrun simctl install "$DEVICE" "$APP"
            OUT="$RUNNER_TEMP/shots/$TAG"
            mkdir -p "$OUT"

            xcrun simctl launch "$DEVICE" com.eworldq8.sunnati -shooting
            sleep 30
            xcrun simctl io "$DEVICE" screenshot "$OUT/1-home.png"

            # simctl has no tap command, and guessing where a tab sits would
            # silently photograph the same screen six times. The app answers a
            # scheme of its own instead, so each screen is asked for by name.
            # The app is relaunched for each screen with -screen <name>. A url
            # scheme made iOS ask "Open in سُنّتي?" and that dialog then sat in
            # the middle of every photograph; a launch argument asks nobody.
            for pair in "azkar:2-azkar" "quran:3-quran" "tasbih:4-tasbih" "hisn:5-hisn" "more:6-more"; do
              VIEW="${pair%%:*}"; NAME="${pair##*:}"
              xcrun simctl terminate "$DEVICE" com.eworldq8.sunnati || true
              sleep 2
              # granted again each time: relaunching brings the question back,
              # and a permission dialog in a store screenshot is a rejection
              xcrun simctl privacy "$DEVICE" grant location com.eworldq8.sunnati || true
              xcrun simctl launch "$DEVICE" com.eworldq8.sunnati -shooting -screen "$VIEW"
              sleep 18
              xcrun simctl io "$DEVICE" screenshot "$OUT/$NAME.png"
            done

            xcrun simctl shutdown "$DEVICE" || true
          }

          # The devices are listed first, so a missing name shows in the log
          # rather than as a bare failure. And one size failing does not lose
          # the other: some screenshots are better than none.
          xcrun simctl list devices available | grep -E "iPhone" | head -20

          # The simulators an Xcode ships change with it, so each slot names
          # what it would like in order and takes the first that exists. Both
          # slots are in Apple's 6.9 inch class, which is the only one the
          # store still asks for; the second is a spare, not a requirement.
          pick () {
            for want in "$@"; do
              if xcrun simctl list devices available | grep -q "$want ("; then echo "$want"; return; fi
            done
          }
          BIG=$(pick "iPhone 18 Pro Max" "iPhone 17 Pro Max" "iPhone 16 Pro Max" "iPhone 16 Plus")
          SPARE=$(pick "iPhone Air" "iPhone 18 Pro" "iPhone 17" "iPhone 16 Plus" "iPhone 16")
          [ -n "$BIG" ] && { shoot "$BIG" "6.9-inch" || echo "::warning::$BIG failed"; } || echo "::warning::no 6.9 inch device on this image"
          [ -n "$SPARE" ] && [ "$SPARE" != "$BIG" ] && { shoot "$SPARE" "spare" || echo "::warning::$SPARE failed"; } || true

      # iPhone Duo, when the Xcode is one that knows it. Its device type comes
      # with Xcode 27.1 but its iOS runtime is not on the image, so that is
      # fetched first. The phone is then made, closed and opened by a helper
      # run inside it (tools/ios/hinge.c), and each screen is photographed on
      # both displays: the outer one when it is closed, the inner one when it
      # is open. Apple asks for these from April 2027, and until then they are
      # the one way to see the app on that phone without holding one. This
      # never fails the build: the phone is new, and so is all of this.
      - name: iPhone Duo
        if: steps.xcode.outputs.duo == 'yes'
        continue-on-error: true
        run: |
          cd ios
          OUT="$RUNNER_TEMP/shots/iphone-duo"
          mkdir -p "$OUT"

          TYPE=$(xcrun simctl list devicetypes | grep -i "iPhone Duo" | head -1 | sed -E 's/.*\((com\.apple\.[^)]*)\).*/\1/')
          [ -n "$TYPE" ] || { echo "::warning::this Xcode has no iPhone Duo"; xcrun simctl list devicetypes | grep -i iphone; exit 0; }
          echo "device type: $TYPE"

          # the newest iOS runtime from 27.1 on, the first that runs the Duo
          runtime () { xcrun simctl list runtimes available | grep -E '^iOS (27\.[1-9]|2[89]\.)' | tail -1 | awk '{print $NF}'; }
          RUNTIME=$(runtime)
          if [ -z "$RUNTIME" ]; then
            echo "fetching the iOS runtime for $(xcodebuild -version | head -1)"
            xcodebuild -downloadPlatform iOS -architectureVariant arm64 || xcodebuild -downloadPlatform iOS
            RUNTIME=$(runtime)
          fi
          [ -n "$RUNTIME" ] || { echo "::warning::no iOS runtime here runs iPhone Duo"; xcrun simctl list runtimes; exit 0; }
          echo "runtime: $RUNTIME"

          UDID=$(xcrun simctl create "Sunnati Duo" "$TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # the displays it has, by the names screenshot takes
          xcrun simctl io "$UDID" enumerate || true

          xcodebuild -project Sunnati.xcodeproj -scheme Sunnati \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
          xcrun simctl install "$UDID" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Sunnati.app"

          # the hinge: built for the simulator and run inside it
          HINGE="$RUNNER_TEMP/hinge"
          xcrun -sdk iphonesimulator clang -arch arm64 -mios-simulator-version-min=17.0 -O2 \
            -o "$HINGE" ../tools/ios/hinge.c -framework IOKit -framework CoreFoundation
          codesign -f -s - "$HINGE"
          fold () { xcrun simctl spawn "$UDID" "$HINGE" "$1"; sleep 5; }

          # both displays every time: the dark one comes out black, which says
          # as plainly as anything which display the app was on
          snap () {
            xcrun simctl io "$UDID" screenshot --display=primary "$OUT/$1-outer.png" || true
            xcrun simctl io "$UDID" screenshot --display=primary-1 "$OUT/$1-inner.png" || true
          }

          pause=30
          for posture in 0:closed 180:open; do
            fold "${posture%%:*}"
            P="${posture##*:}"
            # the six screens of the store, and the mushaf opened at its first
            # spread and at a full one, which on the inner display is a book
            for pair in "home:1-home" "quran:3-quran" "azkar:2-azkar" "tasbih:4-tasbih" "hisn:5-hisn" "more:6-more" \
                        "page1:7-mushaf-1" "page300:8-mushaf-300"; do
              VIEW="${pair%%:*}"; NAME="${pair##*:}"
              xcrun simctl terminate "$UDID" com.eworldq8.sunnati || true
              sleep 2
              xcrun simctl privacy "$UDID" grant location com.eworldq8.sunnati || true
              # -probe has the app write down what the window and the page
              # were each told about the sides of the screen
              case "$VIEW" in
                home)  xcrun simctl launch "$UDID" com.eworldq8.sunnati -shooting -probe ;;
                page*) xcrun simctl launch "$UDID" com.eworldq8.sunnati -shooting -probe -page "${VIEW#page}" ;;
                *)     xcrun simctl launch "$UDID" com.eworldq8.sunnati -shooting -probe -screen "$VIEW" ;;
              esac
              sleep $pause; pause=18
              snap "$P-$NAME"
            done
          done

          # eight launches closed, then eight open, a line each
          LOG="$(xcrun simctl get_app_container "$UDID" com.eworldq8.sunnati data)/Documents/probe.log"
          if [ -f "$LOG" ]; then cat "$LOG"; cp "$LOG" "$OUT/probe.log"; else echo "::warning::the app wrote no probe"; fi

          for f in "$OUT"/*.png; do
            echo "$(basename "$f"): $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/ {printf "%s ", $2}')"
          done
          xcrun simctl shutdown "$UDID" || true

      - name: احفظ الصور
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sunnati-ios-shots
          path: ${{ runner.temp }}/shots/
          retention-days: 14

      - name: احفظ الحزمة
        if: steps.signing.outputs.ready == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: sunnati-ios
          path: ${{ runner.temp }}/out/*.ipa
          retention-days: 14

      # The watch marks the day it sent a build. If the machine this landed on
      # had only the beta, nothing went up, and the mark is taken back so the
      # watch tries again the next day. A run that fails keeps the mark: it
      # would fail again, every day, at the price of a mac.
      - name: إن لم يُرفع شيء فالرصد يعود غداً
        if: inputs.watch && steps.upload.outputs.uploaded != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/xcode-27.1-watch" || true

      # the keychain dies with the machine anyway, but saying so explicitly
      # means no one has to trust that it does
      - name: امسح المفاتيح
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -rf ~/private_keys || true

  # The store, only when a run by hand asks for it: the version made or found,
  # the build attached, what is new from ios/whatsnew, the 6.9 inch
  # screenshots carried over when the new version comes without them, and the
  # iPhone Duo screenshots this run took. Prepare stops there for a person to
  # look; send also sends it for review. On ubuntu, since most of it is
  # waiting for Apple to process the build.
  store:
    needs: build
    if: inputs.store == 'prepare' || inputs.store == 'send'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: هل وصل بناء
        if: needs.build.outputs.uploaded != 'yes'
        run: |
          echo "::error::nothing went up to App Store Connect in this run, a beta Xcode or no key, so there is nothing to take to the store"
          exit 1
      - uses: actions/download-artifact@v7
        with:
          name: sunnati-ios-shots
          path: shots
      - name: المكتبة
        run: python3 -m pip install --quiet --break-system-packages pyjwt cryptography
      - name: إلى المتجر
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SEND: ${{ inputs.store }}
        run: |
          python3 tools/ios/asc-release.py \
            --version "${{ needs.build.outputs.version }}" --build "${{ needs.build.outputs.number }}" \
