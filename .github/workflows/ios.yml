# Builds سُنّتي for iOS on GitHub's own mac, so no mac is needed here.
#
# Two ways to run it:
#   • push a tag like ios-v8.85.0, or press "Run workflow" in the Actions tab
#   • with no signing secrets set, it still builds and runs the tests: that is
#     worth having on its own, since it catches a broken build before anyone
#     goes near a certificate
#
# The secrets it wants, when you are ready to sign:
#   IOS_CERT_P12          the distribution certificate, base64 of the .p12
#   IOS_CERT_PASSWORD     the password you gave that .p12
#   IOS_PROFILE           the app's provisioning profile, base64 of the .mobileprovision
#   IOS_PROFILE_WIDGET    the widget's, the same way: two bundle ids, two profiles
#   IOS_TEAM_ID           the ten characters Apple calls your Team ID
#
# And three more to send the build to App Store Connect from here, so no mac
# is needed for that step either:
#   ASC_KEY_ID            the App Store Connect API key id, ten characters
#   ASC_ISSUER_ID         the issuer id beside it, a uuid
#   ASC_KEY_P8            the .p8 the key came as, base64
#
# Making them is written out in ios/README.md.

name: iOS

on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:

jobs:
  build:
    # macos-15 is the current image; macos-14 is on its way out, and its Xcode
    # is too old to open what xcodegen writes.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # the same six gates the site goes through, so a broken page never
      # reaches a phone wrapped in a shell
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: ثبّت ما تحتاجه الاختبارات
        run: npm install --no-audit --no-fund

      - name: الاختبارات
        run: node --test test/interface.test.js

      # Xcode 16.4 is the image's own default and reads project format 77,
      # which 15.4 refused. Naming it rather than taking whatever "latest"
      # means that week keeps the build reproducible.
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: XcodeGen
        run: brew install xcodegen

      - name: اصنع المشروع
        run: cd ios && xcodegen generate

      # Without secrets the build stops here, having proved it compiles. With
      # them it goes on to sign and package.
      - name: هل هناك توقيع
        id: signing
        run: |
          # all five, or none: a certificate without its profiles fails
          # halfway through with a message about base64, not about profiles
          if [ -n "${{ secrets.IOS_CERT_P12 }}" ] && [ -n "${{ secrets.IOS_PROFILE }}" ] \
             && [ -n "${{ secrets.IOS_PROFILE_WIDGET }}" ] && [ -n "${{ secrets.IOS_TEAM_ID }}" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::أسرار التوقيع ناقصة، سيُبنى بلا توقيع للتحقق فقط"
          fi

      - name: ابنِ بلا توقيع
        if: steps.signing.outputs.ready == 'no'
        run: |
          cd ios
          # the real device, not the simulator: a widget extension is not built
          # for the simulator destination, so a simulator build would pass while
          # the widget stayed broken
          xcodebuild -project Sunnati.xcodeproj -scheme Sunnati \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      # The certificate goes into a keychain made for this run and thrown away
      # with the machine. A keychain of its own, not the login one, so nothing
      # here can reach anything else.
      - name: ضع الشهادة
        if: steps.signing.outputs.ready == 'yes'
        env:
          CERT: ${{ secrets.IOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE }}
          PROFILE_WIDGET: ${{ secrets.IOS_PROFILE_WIDGET }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          PASS=$(openssl rand -base64 24)
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"

          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          # Both profiles, and each is asked for its own name, which is what
          # the build settings and the export refer to it by. Reading the name
          # off the file means the workflow never has to be told it.
          DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$DIR"
          name_of () {
            security cms -D -i "$1" | plutil -extract Name raw -o - -
          }
          echo "$PROFILE" | base64 --decode > "$DIR/sunnati.mobileprovision"
          echo "$PROFILE_WIDGET" | base64 --decode > "$DIR/sunnati-widget.mobileprovision"
          echo "PROFILE_APP=$(name_of "$DIR/sunnati.mobileprovision")" >> "$GITHUB_ENV"
          echo "PROFILE_WIDGET=$(name_of "$DIR/sunnati-widget.mobileprovision")" >> "$GITHUB_ENV"

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: ابنِ ووقّع
        if: steps.signing.outputs.ready == 'yes'
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cd ios
          xcodebuild -project Sunnati.xcodeproj -scheme Sunnati \
            -configuration Release -archivePath "$RUNNER_TEMP/Sunnati.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            SIGN_IDENTITY="Apple Distribution" \
            PROFILE_APP="$PROFILE_APP" \
            PROFILE_WIDGET="$PROFILE_WIDGET" \
            archive

          sed -e "s/\$(DEVELOPMENT_TEAM)/$DEVELOPMENT_TEAM/" \
              -e "s/\$(PROFILE_APP)/$PROFILE_APP/" \
              -e "s/\$(PROFILE_WIDGET)/$PROFILE_WIDGET/" \
              exportOptions.plist > "$RUNNER_TEMP/export.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Sunnati.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/out"

      # From here straight to App Store Connect, when the api key is there.
      # The key lives only in this run's home directory and dies with it. The
      # build shows up under TestFlight within a few minutes and is then
      # attached to a version in App Store Connect by hand.
      - name: هل هناك مفتاح App Store Connect
        id: asc
        if: steps.signing.outputs.ready == 'yes'
        run: |
          if [ -n "${{ secrets.ASC_KEY_P8 }}" ] && [ -n "${{ secrets.ASC_KEY_ID }}" ] \
             && [ -n "${{ secrets.ASC_ISSUER_ID }}" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::مفتاح App Store Connect ناقص، الحزمة تُحفظ ولا تُرفع"
          fi

      - name: ارفع إلى App Store Connect
        if: steps.asc.outputs.ready == 'yes'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          IPA=$(ls "$RUNNER_TEMP"/out/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      # A signed build cannot be installed anywhere without a developer
      # account, so until there is one the app is run in the simulator and
      # photographed. That shows it opens, that the arabic lays out right on
      # iOS, and it produces the screenshots App Store Connect asks for. What
      # it cannot show is the part that matters most: notifications arriving
      # with the app closed. Those need a real phone.
      # App Store Connect wants screenshots at two sizes, and they must show
      # the app doing its work, not a permission dialog. So location is granted
      # before launch rather than answered after, and each screen is reached by
      # its own url on the site the app loads.
      - name: صوّر لقطات المتجر
        run: |
          cd ios
          shoot () {
            DEVICE="$1"; TAG="$2"
            xcodebuild -project Sunnati.xcodeproj -scheme Sunnati \
              -destination "platform=iOS Simulator,name=$DEVICE" \
              -derivedDataPath "$RUNNER_TEMP/dd" -configuration Debug \
              CODE_SIGNING_ALLOWED=NO build

            xcrun simctl boot "$DEVICE" || true
            xcrun simctl bootstatus "$DEVICE" -b

            # granted up front, so no dialog stands in front of the app
            xcrun simctl privacy "$DEVICE" grant location com.eworldq8.sunnati || true

            APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Sunnati.app"
            xcrun simctl install "$DEVICE" "$APP"
            OUT="$RUNNER_TEMP/shots/$TAG"
            mkdir -p "$OUT"

            xcrun simctl launch "$DEVICE" com.eworldq8.sunnati -shooting
            sleep 30
            xcrun simctl io "$DEVICE" screenshot "$OUT/1-home.png"

            # simctl has no tap command, and guessing where a tab sits would
            # silently photograph the same screen six times. The app answers a
            # scheme of its own instead, so each screen is asked for by name.
            # The app is relaunched for each screen with -screen <name>. A url
            # scheme made iOS ask "Open in سُنّتي?" and that dialog then sat in
            # the middle of every photograph; a launch argument asks nobody.
            for pair in "azkar:2-azkar" "quran:3-quran" "tasbih:4-tasbih" "hisn:5-hisn" "more:6-more"; do
              VIEW="${pair%%:*}"; NAME="${pair##*:}"
              xcrun simctl terminate "$DEVICE" com.eworldq8.sunnati || true
              sleep 2
              # granted again each time: relaunching brings the question back,
              # and a permission dialog in a store screenshot is a rejection
              xcrun simctl privacy "$DEVICE" grant location com.eworldq8.sunnati || true
              xcrun simctl launch "$DEVICE" com.eworldq8.sunnati -shooting -screen "$VIEW"
              sleep 18
              xcrun simctl io "$DEVICE" screenshot "$OUT/$NAME.png"
            done

            xcrun simctl shutdown "$DEVICE" || true
          }

          # The devices are listed first, so a missing name shows in the log
          # rather than as a bare failure. And one size failing does not lose
          # the other: some screenshots are better than none.
          xcrun simctl list devices available | grep -E "iPhone" | head -20

          # The image carries no older iPhones, so the second size comes from
          # the 16 Plus at 6.7 inch, which App Store Connect accepts for the
          # smaller class. iPhone 11 Pro Max simply is not there any more.
          shoot "iPhone 16 Pro Max" "6.9-inch" || echo "::warning::6.9 inch failed"
          shoot "iPhone 16 Plus" "6.7-inch" || echo "::warning::6.7 inch failed"

      - name: احفظ الصور
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sunnati-ios-shots
          path: ${{ runner.temp }}/shots/
          retention-days: 14

      - name: احفظ الحزمة
        if: steps.signing.outputs.ready == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: sunnati-ios
          path: ${{ runner.temp }}/out/*.ipa
          retention-days: 14

      # the keychain dies with the machine anyway, but saying so explicitly
      # means no one has to trust that it does
      - name: امسح المفاتيح
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -rf ~/private_keys || true
